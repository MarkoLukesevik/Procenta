<div class="verify-email-page">
  <h1
    [class.verify-email-page__verified]="isVerified"
    [class.verify-email-page__unverified]="!isVerified"
  >
    {{ pageMessage }}
  </h1>

  @if (isVerified) {
    <button (click)="handleHomeClick()">
      {{ t("return_to_home_page") }}
    </button>
  }
</div>
