<div class="lokal-card" (click)="handleCardClick()">
  <div class="lokal-card__image">
    @if (lokal.image) {
      <img [src]="lokal.image" alt="" />
    }
  </div>
  <div class="lokal-card__content">
    <h3 class="lokal-card__content-title">
      {{ lokal.name }}
    </h3>
    <div class="lokal-card__content-location">
      {{ lokal.location }}
    </div>
  </div>
</div>
